<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth Tabliss Live Wallpaper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 100% Static Wallpaper Layers (Instant Local Offline Image, 0 FPS when idle) -->
  <div id="wallpaper-container">
    <div id="bg-layer-a" class="bg-layer active" style="background-image: url('assets/default_earth.jpg'), url('assets/original_wallpaper.png');"></div>
    <div id="bg-layer-b" class="bg-layer"></div>
    <div id="bg-overlay"></div>
  </div>

  <!-- Main Viewport Layout -->
  <main id="app-container">
    <!-- Center Stage: Tabliss Minimalist Typography Clock -->
    <section class="hud-center" id="hud-center">
      <div id="clock-display" class="clock-display">
        <span id="clock-hours">12</span><span class="clock-colon">:</span><span id="clock-minutes">00</span>
      </div>
      <div id="date-display" class="date-display">2026年11月10日 星期二</div>
      <div id="greeting-display" class="greeting-display">漫游蔚蓝星球</div>
    </section>

    <!-- Bottom Safe Area: Location Badge (Strictly Above Taskbar) -->
    <footer class="hud-bottom" id="hud-bottom">
      <div class="geo-card" id="geo-card">
        <div class="geo-title-row">
          <span class="geo-pin">📍</span>
          <h2 id="geo-country" class="geo-country">Australia</h2>
          <span id="geo-terrain" class="geo-terrain">Coastal</span>
        </div>
        <p id="geo-region" class="geo-region">Torres Strait</p>
        <div class="geo-coords" id="geo-coords" title="点击复制坐标 / Click to copy">
          <span>LAT: <span id="val-lat">-10.040181</span></span>
          <span class="coord-sep">•</span>
          <span>LNG: <span id="val-lng">143.560709</span></span>
          <span id="coord-copied" class="coord-copied">COPIED</span>
        </div>
        <div class="geo-meta-row" id="geo-meta-row">
          <span class="geo-meta-pill" id="geo-solar" title="当地太阳时 / Local Solar Time">☀️ 14:34 (UTC+10)</span>
          <span class="geo-meta-pill" id="geo-climate" title="气候带 / Climate Zone">Tropics</span>
          <span class="geo-meta-pill" id="geo-alt" title="卫星视高 / Satellite Eye Altitude">ALT: ~18km</span>
          <a id="geo-map-link" class="geo-meta-pill geo-meta-link" href="#" target="_blank" rel="noopener" title="Google 地图卫星视图 / Google Maps Satellite">MAP ↗</a>
        </div>
      </div>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
